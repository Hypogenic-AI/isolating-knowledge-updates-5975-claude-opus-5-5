[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for experiments"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "arxiv>=4.0.1",
    "av>=17.1.0",
    "beautifulsoup4>=4.15.0",
    "datasets>=5.0.1",
    "einops>=0.8.2",
    "fairscale>=0.4.13",
    "gpustat>=1.1.1",
    "higher>=0.2.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "hydra-core>=1.3.7",
    "iopath>=0.1.10",
    "matplotlib>=3.10.9",
    "nltk>=3.10.3",
    "omegaconf>=2.3.1",
    "openai>=3.24.0",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=2.3.3",
    "peft>=0.21.2",
    "pypdf>=6.19.0",
    "pyyaml>=6.0.3",
    "qwen-vl-utils>=0.0.14",
    "requests>=2.34.2",
    "rouge>=1.0.1",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "sentence-transformers>=6.1.0",
    "sentencepiece>=0.2.2",
    "tabulate>=0.10.0",
    "timm>=1.0.30",
    "torch==2.9.1",
    "transformers>=5.18.0",
    "zhipuai>=2.1.5.20250825",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
